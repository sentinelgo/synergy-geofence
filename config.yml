version: 1.0.0
common:
  server:
    host: 0.0.0.0
    port: ${SERVER_PORT}
  datastore:
    host: ${ORACLE_HOST}
    port: ${ORACLE_PORT}
    username: ${ORACLE_USER}
    password: "${ORACLE_PASSWORD}"
    dbname: ${ORACLE_SERVICE_NAME}
    config:
      namingstrategy:
        identifiermaxlength: 128
      dialector:
        type: oracle
        preferredcase: screamingsnakecase
        varcharsizeischarlength: true
        namingcasesensitive: true
        sessiontimezone: UTC
    # Schema is owned by the DBA (see db/schema/*.sql) — this service never
    # migrates the database itself, so migration.enabled is intentionally
    # left unset rather than wired up here.
  activity-log:
    disabled: false
    address: ${ACTIVITY_LOG_ADDRESS}
  # Used for every agency-service m2m call (subagency hierarchy lookup,
  # home-agency profile — see internal/handler/agency_client.go). The
  # client-credentials client is a confidential Hydra client, one per
  # environment, using client_secret_basic (auth-style: in-header) with
  # agency.read as its only allowed scope.
  agency:
    base-url: ${AGENCY_SERVICE_BASE_URL}
    client-credentials:
      client-id: ${GEOFENCE_AGENCY_CLIENT_ID}
      # A literal file path, not a ${...}-style substitution token — client-secret is
      # util.FileOrContent (see synergy-common), which reads this path's
      # content when it exists on disk rather than treating the string as
      # inline content. The file is a dedicated Docker secret (see
      # deploy/docker-stack*.yml's geofence_agency_client_secret secret and
      # the Jenkinsfiles' "Create Agency Client Secret" stage) pulled from
      # Vault at deploy time and mounted here — unlike every other value in
      # this file, it's never baked into the geofence_config secret/rendered
      # config.yml, and never passed as a container environment variable.
      client-secret: /run/secrets/geofence_agency_client_secret
      token-url: ${HYDRA_TOKEN_URL}
      scopes: ["agency.read"]
      auth-style: in-header
  geofence:
    enabled: ${GEOFENCE_AUTH_ENABLED}
    audience: ${GEOFENCE_AUTH_AUDIENCE}
    userinfo-url: ${HYDRA_USERINFO_URL}
  jwt:
    verification:
      # Per environment: true where no real IDP is reachable (local/dev);
      # false (with the issuers below actually enforced) once an environment
      # has a real identity provider to validate bearer tokens against.
      disabled: ${JWT_VERIFICATION_DISABLED}
      ignored:
        - method: "*"
          path: "/health"
        - method: "*"
          path: "/swagger(/.*)?"
        - method: "*"
          path: "/swagger-doc\\.yaml"
      issuers:
        - issuer: https://id.${IDENTITY_DOMAIN}
          audience: ["${IDENTITY_DOMAIN}"]
        - issuer: https://agency.${IDENTITY_DOMAIN}
          audience: ["${IDENTITY_DOMAIN}"]
        - issuer: https://user.${IDENTITY_DOMAIN}
          audience: ["${IDENTITY_DOMAIN}"]
  signing:
    verification:
      block-unsigned: false
      allow-unsigned: true
      unsigned-paths:
        - method: "*"
          path: "/health"
        - method: "*"
          path: "^/swagger(/.*)?$"
        - method: "*"
          path: "^/swagger-doc\\.yaml$"
      allowed-issuers:
        - https://id.${IDENTITY_DOMAIN}
        - https://user.${IDENTITY_DOMAIN}
        - https://agency.${IDENTITY_DOMAIN}
      blacklisted-kids: []

# Event publishing (Apache Pulsar) — see pkg/events. Disabled by default so
# the service runs without a broker for local development; geofence
# mutations simply won't be published until this is enabled.
pulsar:
  enabled: true
  service-url: ${PULSAR_URL}
  topic: persistent://synergy/${ACTIVE_ENVIRONMENT}.geofences/geofence_events
  connection-timeout-seconds: 10
