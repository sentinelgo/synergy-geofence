version: 1.0.0
common:
  server:
    host: 0.0.0.0
    port: ${SERVER_PORT}
  datastore:
    host: ${ORACLE_HOST}
    port: ${ORACLE_PORT}
    username: ${ORACLE_USER}
    password: "${ORACLE_PASSWORD}"
    dbname: ${ORACLE_SERVICE_NAME}
    config:
      namingstrategy:
        identifiermaxlength: 128
      dialector:
        type: oracle
        preferredcase: screamingsnakecase
        varcharsizeischarlength: true
        namingcasesensitive: true
        sessiontimezone: UTC
    # Schema is owned by the DBA (see db/schema/*.sql) — this service never
    # migrates the database itself, so migration.enabled is intentionally
    # left unset rather than wired up here.
  activity-log:
    disabled: false
    address: ${ACTIVITY_LOG_ADDRESS}
  geofence:
    enabled: ${GEOFENCE_AUTH_ENABLED}
    audience: ${GEOFENCE_AUTH_AUDIENCE}
    userinfo-url: ${HYDRA_USERINFO_URL}
  jwt:
    verification:
      # Per environment: true where no real IDP is reachable (local/dev);
      # false (with the issuers below actually enforced) once an environment
      # has a real identity provider to validate bearer tokens against.
      disabled: ${JWT_VERIFICATION_DISABLED}
      ignored:
        - method: "*"
          path: "/health"
        - method: "*"
          path: "/swagger(/.*)?"
        - method: "*"
          path: "/swagger-doc\\.yaml"
      issuers:
        - issuer: https://id.${IDENTITY_DOMAIN}
          audience: ["${IDENTITY_DOMAIN}"]
        - issuer: https://agency.${IDENTITY_DOMAIN}
          audience: ["${IDENTITY_DOMAIN}"]
        - issuer: https://user.${IDENTITY_DOMAIN}
          audience: ["${IDENTITY_DOMAIN}"]
  signing:
    verification:
      block-unsigned: false
      allow-unsigned: true
      unsigned-paths:
        - method: "*"
          path: "/health"
        - method: "*"
          path: "^/swagger(/.*)?$"
        - method: "*"
          path: "^/swagger-doc\\.yaml$"
      allowed-issuers:
        - https://id.${IDENTITY_DOMAIN}
        - https://user.${IDENTITY_DOMAIN}
        - https://agency.${IDENTITY_DOMAIN}
      blacklisted-kids: []

# Event publishing (Apache Pulsar) — see pkg/events. Disabled by default so
# the service runs without a broker for local development; geofence
# mutations simply won't be published until this is enabled.
pulsar:
  enabled: true
  service-url: ${PULSAR_URL}
  topic: persistent://synergy/${ACTIVE_ENVIRONMENT}.geofences/geofence_events
  connection-timeout-seconds: 10
