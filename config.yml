version: 1.0.0
common:
  server:
    host: 0.0.0.0
    port: 7010
  datastore:
    host: localhost
    port: 1521
    username: geofence_service
    password: changeme
    dbname: geofence.example.oraclevcn.com
    config:
      namingstrategy:
        identifiermaxlength: 128
      dialector:
        type: oracle
        preferredcase: screamingsnakecase
        varcharsizeischarlength: true
        namingcasesensitive: true
        sessiontimezone: UTC
    migration:
      enabled: true
  sidecar:
    base-url: http://localhost:8090
  jwt:
    verification:
      # Disabled for local development so the service runs without a real
      # IDP; flip to false (and confirm issuers/audiences) per environment
      # to require and validate bearer tokens.
      disabled: true
      ignored:
        - method: "*"
          path: "/health"
      issuers:
        - issuer: https://id.dev.sentinelsyn.com
          audience: ["dev.sentinelsyn.com"]
        - issuer: https://agency.dev.sentinelsyn.com
          audience: ["dev.sentinelsyn.com"]
        - issuer: https://user.dev.sentinelsyn.com
          audience: ["dev.sentinelsyn.com"]
  signing:
    verification:
      block-unsigned: false
      allow-unsigned: true
      unsigned-paths:
        - method: "*"
          path: "/health"
      allowed-issuers:
        - https://id.dev.sentinelsyn.com
        - https://user.dev.sentinelsyn.com
        - https://agency.dev.sentinelsyn.com
      blacklisted-kids: []

# Event publishing (Apache Pulsar) — see pkg/events. Disabled by default so
# the service runs without a broker for local development; geofence
# mutations simply won't be published until this is enabled.
pulsar:
  enabled: false
  service-url: pulsar://localhost:6650
  topic: persistent://synergy/geofence/events
  connection-timeout-seconds: 10