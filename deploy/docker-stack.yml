# Docker Swarm stack for synergy-geofence.
#
# Deploy with ./deploy.sh (handles secret versioning + the one-off DB
# migration) rather than `docker stack deploy` directly — see that script
# for details.
#
# Pulsar is NOT deployed by this stack: geofence-service publishes to a
# centrally-hosted Pulsar cluster shared by other services, addressed via
# `pulsar.service-url` inside the mounted config secret. There is exactly
# one config secret, so both replicas (one per swarm node) always point at
# the same central broker.
version: "3.9"

services:
  geofence-service:
    image: ${IMAGE:-synergy-geofence}:${IMAGE_TAG:-latest}
    ports:
      - target: 7010
        published: ${SERVER_PORT:-7010}
        protocol: tcp
        mode: host
    secrets:
      - source: ${CONFIG_SECRET:-geofence_config}
        target: /app/config.yml
        uid: "1000"
        gid: "1000"
        mode: 0440
    networks:
      - geofence-net
    deploy:
      mode: replicated
      replicas: ${REPLICAS:-2}
      placement:
        # One replica per node across the 2-node cluster. Add a
        # node.labels constraint here (e.g. node.labels.role == geofence)
        # if this swarm hosts more than the two dedicated app nodes.
        max_replicas_per_node: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7010/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  geofence-net:
    driver: overlay
    attachable: true

secrets:
  geofence_config:
    external: true
    name: ${CONFIG_SECRET:-geofence_config}